<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jobs & Invoices</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1f24;--mute:#6b7280;--line:#e3e1da;--acc:#2f5fd0;--accink:#fff;--bad:#c0392b;--ok:#1e8e5a}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--card:#1f2228;--ink:#ecebe6;--mute:#9aa0aa;--line:#32363e;--acc:#6b93ff;--accink:#0d1220;--bad:#ff7b6b;--ok:#4fcf92}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header h1{margin:0;padding:10px 14px 0;font-size:17px}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px}
nav button{border:0;background:none;color:var(--mute);padding:8px 12px;border-radius:8px;font:inherit;font-weight:600;white-space:nowrap}
nav button.on{background:var(--acc);color:var(--accink)}
main{max-width:980px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
button.b,a.b{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer;text-decoration:none}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button.d{color:var(--bad)}
button.s{padding:4px 8px;font-size:13px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:64px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mute{color:var(--mute)}.small{font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .dh{text-align:center;font-size:12px;color:var(--mute);padding:4px 0}
.cell{min-height:64px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px;overflow:hidden;cursor:pointer}
.cell.out{opacity:.45}.cell.sel{outline:2px solid var(--acc)}.cell.today .n{background:var(--acc);color:var(--accink);border-radius:10px;padding:0 5px}
.n{font-size:12px;font-weight:600}
.chip{font-size:10.5px;color:#fff;border-radius:3px;padding:0 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{display:flex;gap:8px;align-items:stretch;padding:8px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.bar{width:5px;border-radius:3px;flex:none}
.tag{font-size:12px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--mute)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;overflow:auto;padding:10px}
#modal.on{display:block}
.mb{background:var(--card);max-width:720px;margin:0 auto;border-radius:12px;padding:14px}
.inv{background:#fff;color:#111;padding:26px;border:1px solid #ddd;border-radius:6px;position:relative;font-size:14px}
.inv h1{margin:0 0 4px;font-size:26px;letter-spacing:.5px}
.inv .top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.inv table{width:100%;border-collapse:collapse;margin:18px 0 8px}
.inv th{text-align:start;border-bottom:2px solid #111;padding:6px 4px;font-size:12px;text-transform:uppercase}
.inv td{padding:6px 4px;border-bottom:1px solid #e5e5e5;vertical-align:top}
.inv .num{text-align:end;white-space:nowrap}
.inv .tot{margin-inline-start:auto;width:260px}
.inv .tot div{display:flex;justify-content:space-between;padding:3px 0}
.inv .grand{font-weight:700;font-size:16px;border-top:2px solid #111;margin-top:4px;padding-top:6px}
.inv .stamp{position:absolute;top:40%;left:30%;font-size:60px;color:rgba(30,142,90,.25);border:6px solid rgba(30,142,90,.25);padding:0 14px;transform:rotate(-14deg);font-weight:800}
.inv .foot{margin-top:22px;font-size:13px;color:#444;white-space:pre-line}
@media(max-width:560px){.g2{grid-template-columns:1fr}.cell{min-height:52px}.chip{display:none}.cell .dot{display:block}.inv{padding:14px}}
.dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:3px}.dots i{width:7px;height:7px;border-radius:50%}
@media(min-width:561px){.dots{display:none}}
#modal .decl,.decl{font-family:Cambria,Georgia,'Times New Roman',serif;font-size:13px}
.inv.decl .dh{font-weight:700;font-size:15px;margin-bottom:34px}
.sigimg{display:block;max-height:62px;max-width:230px;mix-blend-mode:multiply;margin:0 0 2px}
.inv.decl table{border-collapse:collapse;width:100%;margin:0 0 30px}
.inv.decl th,.inv.decl td{border:1.5px solid #000;padding:3px 6px;text-align:left;font-size:13px;text-transform:none;height:24px;vertical-align:top}
.inv.decl .d1 th{width:26%}
.inv.decl .dn{margin-top:26px;line-height:1.4}
.inv.attw{font-family:Calibri,Carlito,Arial,sans-serif;font-size:13px}
.inv.attw h3{margin:14px 0 6px;font-size:15px}
.inv.attw table{border-collapse:collapse;margin:0 0 14px}
.inv.attw .att{width:100%}
.inv.attw .att th{background:#a9d18e;border:1px solid #000;padding:3px 6px;text-align:center;font-size:13px;text-transform:none}
.inv.attw .att td{border:1px solid #000;padding:2px 6px;text-align:center;height:21px}
.inv.attw .att td.l{text-align:left}
.inv.attw .att td.gap,.inv.attw .att th.gap{width:14px;padding:0}
.inv.attw .att tr.no td{background:#e7e6e6}
.inv.attw .atot th,.inv.attw .atot td{border:1px solid #000;padding:3px 8px;font-weight:700;text-align:left;font-size:13px;text-transform:none}
.inv.attw .atot td{text-align:right;min-width:60px}
.b.s.soft{border-style:dashed;color:var(--mute)}
@media print{header,main,.noprint{display:none!important}#modal{position:static;background:none;padding:0;display:block}.mb{padding:0;max-width:none}.inv{border:0;padding:0}body{background:#fff}}
</style>
</head>
<body>

<main id="main"></main>
<div id="modal"></div>

 {id:'c_nihs',name:'Joodse Gemeente Amsterdam (NIHS)',kind:'Organization',email:'info@nihs.nl',phone:'+31 (0)20 646 00 46',address:'Max Havelaarlaan 435\n1183 LZ Amstelveen',notes:'Muiderberg burials were invoiced to them directly; for the last months JBW invoices NIHS, so log those as record only.',rates:{},payments:[],layout:'',declTitle:'',declNotes:''},

 return d}}catch(e){}const d=defaults();d.m1=1;d.m2=1;return d}

const ui={tab:'cal',month:new Date(new Date().getFullYear(),new Date().getMonth(),1),sel:today(),inv:{jt:'',cl:''},f:{jt:'',cl:'',pl:'',from:'',to:'',q:'',st:''}};

/* ---------- calculations ---------- */
function hours(ev){if(!ev.start||!ev.end)return 0;const[a,b]=ev.start.split(':').map(Number),[c,d]=ev.end.split(':').map(Number);const h=((c*60+d)-(a*60+b))/60;return h>0?Math.round(h*100)/100:0}
function qtyOf(ev){const m=jtOf(ev.jt).mode;if(m==='hourly')return hours(ev)||+ev.qty||0;if(m==='session')return ev.qty===''||ev.qty==null?1:+ev.qty;if(m==='daystudent')return +ev.qty||0;return 1}
function rateOf(ev){const jt=jtOf(ev.jt),c=clOf(ev.client);
 if(ev.rate!==''&&ev.rate!=null)return +ev.rate;
 if(c&&c.rates&&c.rates[ev.jt]!==undefined&&c.rates[ev.jt]!=='')return +c.rates[ev.jt];
 return +jt.rate||0}
function amountOf(ev){const jt=jtOf(ev.jt),r=rateOf(ev),q=qtyOf(ev);
 if(ev.status==='cancelled'&&ev.cancelBy==='them'&&ev.charge&&ev.cancelFee!==''&&ev.cancelFee!=null)return +ev.cancelFee;
 if(jt.mode==='flat')return r;
 if(jt.mode==='daystudent')return r+(+jt.rate2||0)*q;
 return r*q}
const layoutOf=(jt,c)=>(c&&c.layout)||(jt.tpl&&jt.tpl.layout)||'itemized';
const counts=e=>e.status!=='cancelled'||(e.cancelBy==='them'&&!!e.charge);
const billable=ev=>counts(ev)&&!ev.noinv&&!jtOf(ev.jt).trackOnly&&ev.date<=today();
const byDT=(a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||''));
function conflicts(ev){return S.events.some(o=>o.id!==ev.id&&o.status!=='cancelled'&&o.date===ev.date&&o.start&&o.end&&ev.start&&ev.end&&o.start<ev.end&&ev.start<o.end)}
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const tmin=s=>{const p=String(s||'0:0').split(':').map(Number);return (p[0]||0)*60+(p[1]||0)};
const mtime=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const DEFAULT_HOURS={0:{on:true,from:'18:00',to:'22:30',from2:'09:00',to2:'13:00'},1:{on:true,from:'18:00',to:'22:30',from2:'09:00',to2:'13:00'},2:{on:true,from:'18:00',to:'22:30',from2:'09:00',to2:'13:00'},3:{on:true,from:'18:00',to:'22:30',from2:'09:00',to2:'13:00'},4:{on:true,from:'18:00',to:'22:30',from2:'09:00',to2:'13:00'},5:{on:true,from:'09:00',to:'22:30',from2:'',to2:''},6:{on:true,from:'16:00',to:'22:30',from2:'',to2:''}};
const hoursOf=w=>Object.assign({},DEFAULT_HOURS[w],(S.settings.hours||{})[w]);
const candMin=()=>(S.settings.candles==null||S.settings.candles==='')?18:+S.settings.candles;
const tzeitMin=()=>(S.settings.tzeit==null||S.settings.tzeit==='')?50:+S.settings.tzeit;
const bufMin=()=>(S.settings.buffer==null||S.settings.buffer==='')?15:+S.settings.buffer;
const stepMin=()=>+S.settings.step||30;
const shortD=s=>fdate(s).replace(/ \d{4}$/,'');
/* sunrise / sunset for Amsterdam, shown on the Netherlands clock (handles summer/winter time) */
let _sunFmt=null;const _sunCache={};
function sunTimes(ds){if(_sunCache[ds])return _sunCache[ds];let res={rise:null,set:null};
 try{const [y,mo,d]=ds.split('-').map(Number),lat=52.3676,lon=4.9041,rad=Math.PI/180,zen=90.833,lngH=lon/15,N=Math.floor((Date.UTC(y,mo-1,d)-Date.UTC(y,0,0))/86400000);
  const calc=rise=>{const t=N+((rise?6:18)-lngH)/24,M=0.9856*t-3.289;let L=M+1.916*Math.sin(M*rad)+0.020*Math.sin(2*M*rad)+282.634;L=((L%360)+360)%360;
   let RA=Math.atan(0.91764*Math.tan(L*rad))/rad;RA=((RA%360)+360)%360;RA+=Math.floor(L/90)*90-Math.floor(RA/90)*90;RA/=15;
   const sinD=0.39782*Math.sin(L*rad),cosD=Math.cos(Math.asin(sinD)),cosH=(Math.cos(zen*rad)-sinD*Math.sin(lat*rad))/(cosD*Math.cos(lat*rad));
   if(cosH>1||cosH<-1)return null;let H=(rise?360-Math.acos(cosH)/rad:Math.acos(cosH)/rad)/15;const T=H+RA-0.06571*t-6.622,UT=(((T-lngH)%24)+24)%24;return Date.UTC(y,mo-1,d)+UT*3600000};
  _sunFmt=_sunFmt||new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Amsterdam',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  const loc=ms=>{if(ms==null)return null;const p=_sunFmt.formatToParts(new Date(ms));return +p.find(x=>x.type==='hour').value*60+ +p.find(x=>x.type==='minute').value};
  res={rise:loc(calc(true)),set:loc(calc(false))}}catch(e){}
 return _sunCache[ds]=res}
function sunLine(date){const s=sunTimes(date);if(s.set==null)return'';let x='';if(!isRest(date)&&isRest(addDays(date,1)))x=` · Candle lighting ${mtime(s.set-candMin())}`;else if(!isRest(date)&&isRest(addDays(date,-1)))x=` · Shabbat / Yom Tov out ~${mtime(s.set+tzeitMin())}`;return`<div class="small mute">Sunrise ${mtime(s.rise)} · Sunset ${mtime(s.set)}${x}</div>`}
const blocksOf=()=>S.settings.blocks||DEFAULT_BLOCKS;
const bkey=b=>b.mode==='sunset'?(b.label||'')+'|sunset|'+(+b.off||0)+'|'+(+b.len||0):(b.label||'')+'|'+b.from+'|'+b.to;
const excOn=date=>(S.settings.exc||[]).filter(x=>x.from<=date&&date<=(x.to||x.from));
const isRest=d=>pd(d).getDay()===6||!!(()=>{const x=hebHoliday(d);return x&&!/^Erev/.test(x)})();
function hoursFor(date){const ex=excOn(date),off=ex.find(x=>x.type==='off');if(off)return{on:false,from:'',to:'',from2:'',to2:'',reason:off.label};const o=ex.find(x=>x.type==='hours');if(o)return{on:true,from:o.start,to:o.end,from2:'',to2:''};
 const H=Object.assign({},hoursOf(pd(date).getDay()));if(!H.on)return H;
 if(pd(date).getDay()===6&&!offName(date)){const set=sunTimes(date).set;if(set==null)return Object.assign(H,{on:false,reason:'Shabbat'});const st=set+tzeitMin();H.capFrom=st;if(st>tmin(H.from)){H.from=mtime(Math.min(st,1439));H.capStart=true}H.from2='';H.to2='';if(tmin(H.from)>=tmin(H.to)){H.on=false;H.reason='Shabbat ends too late'}return H}
 if(!isRest(date)){const set=sunTimes(date).set;if(set!=null){
  if(isRest(addDays(date,1))){const cap=set-candMin();H.capAt=cap;if(cap<tmin(H.to)){H.to=mtime(Math.max(cap,0));H.capEnd=true}H.from2='';H.to2=''}
  if(isRest(addDays(date,-1))){const st=set+tzeitMin();H.capFrom=st;if(st>tmin(H.from)){H.from=mtime(Math.min(st,1439));H.capStart=true}H.from2='';H.to2=''}}
  if(tmin(H.from)>=tmin(H.to)){H.on=false;H.reason=H.capEnd?'Shabbat / Yom Tov starts too early':'Shabbat / Yom Tov ends too late'}}
 return H}
function offName(s){const hd=hebHoliday(s);if(hd&&!/^Erev/.test(hd))return hd;const ex=excOn(s).find(x=>x.type==='off');return ex?(ex.label?'Off: '+ex.label:'Day off'):''}
function availFor(c,w){if(!c||!c.avail||!Object.keys(c.avail).length)return null;return c.avail[w]||false}

function repDates(date,rep,cnt,days){const n=rep==='none'||!rep?1:Math.max(1,Math.min(120,+cnt||1)),dates=[],skipped=[];let dy=date;
 if(rep==='week'&&days&&days.length){const b=pd(date).getDay(),ws=[...new Set([b,...days])];for(let i=0;i<n;i++)ws.forEach(w=>{const dt=addDays(date,7*i+((w-b+7)%7));const off=offName(dt);if(off)skipped.push({d:dt,why:off});else dates.push(dt)});dates.sort();return{dates,skipped}}
 for(let i=0;i<n;i++){if(rep==='day')while(pd(dy).getDay()===6)dy=addDays(dy,1);const off=(rep&&rep!=='none')?offName(dy):'';if(off)skipped.push({d:dy,why:off});else dates.push(dy);dy=addDays(dy,rep==='week'?7:1)}
 return{dates,skipped}}

 const q=document.getElementById('repq');if(q)q.style.display=r==='none'?'none':'';
 const cl=document.getElementById('cntl');if(cl)cl.textContent=r==='day'?'How many days in total':'How many weeks in total (counting this one)';
 if(r==='none'){el.textContent='';return}
 const wr=document.getElementById('wdrow');if(wr)wr.style.display=r==='week'?'':'none';const x=repDates(f.date.value,r,f.cnt.value,formDays(f));el.innerHTML='<b>Will add '+x.dates.length+' lesson'+(x.dates.length===1?'':'s')+':</b> '+x.dates.slice(0,12).map(d=>pd(d).toLocaleDateString('en',{weekday:'short',day:'numeric',month:'short'})).join(' · ')+(x.dates.length>12?' …':'')+(x.skipped.length?'<br>Skipped: '+x.skipped.map(s=>shortD(s.d)+' ('+E(s.why)+')').join(', '):'')}
function lastPay(c){return (c.payments||[]).reduce((m,p)=>{let d=p.date;if(p.ev){const e=S.events.find(x=>x.id===p.ev);if(e)d=e.date}return d>m?d:m},'')}
/* which lessons are paid: a lesson ticked paid on its own, else lump payments cover the oldest lessons first */
function payMap(c){const r2=n=>Math.round(n*100)/100,evs=S.events.filter(e=>e.client===c.id&&jtOf(e.jt).trackOnly&&counts(e)&&amountOf(e)>0).sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||'')));
 const pays=c.payments||[],byEv={};let pool=-Math.max(0,+c.openBal||0);
 pays.forEach(p=>{if(p.ev)(byEv[p.ev]=byEv[p.ev]||[]).push(+p.amount||0);else pool+=+p.amount||0});
 const ids=new Set(evs.map(e=>e.id));Object.keys(byEv).forEach(k=>{if(!ids.has(k))pool+=byEv[k].reduce((a,b)=>a+b,0)});   /* money tied to a lesson that no longer counts becomes credit */
 const st={},due={},unpaid=[];let owed=0;
 evs.forEach(e=>{const a=amountOf(e),got=(byEv[e.id]||[]).reduce((x,y)=>x+y,0),own=Math.min(got,a);if(got>a)pool+=got-a;let need=r2(a-own);
  if(need<=0.004){st[e.id]='paid';due[e.id]=0;return}
  if(pool>=need-0.004){pool-=need;st[e.id]=got>0?'paid':'lump';due[e.id]=0;return}
  need=r2(need-Math.max(pool,0));pool=0;st[e.id]=need<a?'part':'unpaid';due[e.id]=need;if(e.date<=today()){unpaid.push({e,due:need});owed+=need}});
 return{st,due,unpaid,owed:r2(owed)}}

function payTag(e){if(!jtOf(e.jt).trackOnly||!counts(e)||!(amountOf(e)>0))return'';if(!e.client){if(e.paid)return`<button class="tag ok" data-a="evpay" data-v="${e.id}" style="background:none;cursor:pointer">Paid ✓</button>`;return e.date>today()?'':`<button class="tag bad" data-a="evpay" data-v="${e.id}" style="background:none;cursor:pointer">Unpaid · tap when paid</button>`}const c=clOf(e.client);if(!c)return'';const s=payMap(c).st[e.id];
 if(s==='paid')return`<button class="tag ok" data-a="evpay" data-v="${e.id}" style="background:none;cursor:pointer">Paid ✓</button>`;if(s==='lump')return'<span class="tag ok">Paid (from credit)</span>';
 if(e.date>today())return'';const d=payMap(c).due[e.id];return`<button class="tag bad" data-a="evpay" data-v="${e.id}" style="background:none;cursor:pointer">${s==='part'?'Still owed '+money(d,S.settings.currency,'en')+' · tap':'Unpaid · tap when paid'}</button>`}

 modal(`<h2>Unpaid lessons: ${E(c.name)}</h2>${pm.unpaid.length?`<div class="small mute">Past lessons that are not paid yet. Tap Paid when they hand you the money.</div>`+pm.unpaid.map(x=>`<div class="ev"><div class="sp"><b>${fdate(x.e.date)}</b> <span class="small mute">${E(x.e.start||'')}${x.e.end?'–'+E(x.e.end):''}</span></div><div style="text-align:end"><b>${money(x.due,cur,'en')}</b> <button class="b s p" data-a="evpay" data-v="${x.e.id}">Paid</button></div></div>`).join('')+`<div class="row" style="margin-top:10px"><b class="sp">Total ${money(pm.owed,cur,'en')}</b><button class="b p" data-a="paidall" data-v="${id}">Mark all paid</button></div>`:'<div class="card mute">Nothing outstanding.</div>'}

function ledger(c){const items=[];S.events.filter(e=>e.client===c.id&&jtOf(e.jt).trackOnly&&e.date<=today()).forEach(e=>items.push({d:e.date,t:0,e}));
 (c.payments||[]).forEach(p=>items.push({d:p.date,t:1,p}));items.sort((a,b)=>a.d.localeCompare(b.d)||a.t-b.t);
 const r2=n=>Math.round(n*100)/100;let bal=+c.openBal||0,charged=0,paid=0,held=0;
 const rows=items.map(it=>{if(it.e){const a=counts(it.e)?amountOf(it.e):0;charged=r2(charged+a);bal=r2(bal+a);if(it.e.status!=='cancelled')held++;return{...it,amt:a,bal}}
  const a=+it.p.amount||0;paid=r2(paid+a);bal=r2(bal-a);return{...it,amt:a,bal}});
 return{rows,charged,paid,bal,held,open:+c.openBal||0,has:items.some(i=>i.e)}}

 <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="tamt" style="width:auto"${j.tpl.showAmount?' checked':''}>Attendance sheet: print the monthly amount on the report</label></details>

 ${S.jobTypes.map(j=>`<div class="row" style="margin:3px 0"><span class="sp small">${E(j.name)}</span>${(j.tiers&&j.tiers.length)?`<select data-ch="cltier" data-jt="${j.id}" style="width:150px"><option value="">Pick a price…</option>${j.tiers.map(t=>`<option value="${t.rate}"${(c.rates&&+c.rates[j.id]===t.rate)?' selected':''}>${E(t.name)} (${t.rate})</option>`).join('')}</select>`:''}<input type="number" step="any" style="width:130px" name="r_${j.id}" placeholder="${j.rate}" value="${(c.rates&&c.rates[j.id]!==undefined)?c.rates[j.id]:''}"></div>`).join('')}

const A={
 tab(v){ui.tab=v;render()},
 sel(v){ui.sel=v;const d=pd(v);if(d.getMonth()!==ui.month.getMonth())ui.month=new Date(d.getFullYear(),d.getMonth(),1);render()},
 mon(v){v=+v;ui.month=v===0?new Date(new Date().getFullYear(),new Date().getMonth(),1):new Date(ui.month.getFullYear(),ui.month.getMonth()+v,1);if(v===0)ui.sel=today();render()},
 close(){closeModal()},
 evnew(){evForm(null,ui.sel)},evedit(v){evForm(v)},
 evdel(v){const e=S.events.find(x=>x.id===v);if(!e)return;const lt=laterOf(e);
  if(!lt.length){if(!confirm('Delete this entry? (You can put it back from Settings → Recently deleted.)'))return;toTrash([e]);S.events=S.events.filter(x=>x.id!==v);save();closeModal();render();return}
  modal(`<h2>Delete lesson</h2><p>This lesson is part of a repeating series with ${lt.length} later lesson${lt.length===1?'':'s'}.</p><div class="row"><button class="b d" data-a="evdel1" data-v="${v}">Delete only this one</button></div><div class="row" style="margin-top:8px"><button class="b d" data-a="evdelN" data-v="${v}">Delete this and all ${lt.length} later lessons</button></div><div class="row" style="margin-top:8px"><button class="b" data-a="close">Keep them</button></div>`)},
 evdel1(v){const e=S.events.find(x=>x.id===v);if(!e)return;toTrash([e]);S.events=S.events.filter(x=>x.id!==v);save();closeModal();render()},
 evdelN(v){const e=S.events.find(x=>x.id===v);if(!e)return;const l=[e,...laterOf(e)],ids=new Set(l.map(x=>x.id));toTrash(l);S.events=S.events.filter(x=>!ids.has(x.id));save();closeModal();render()},
 trashback(v){const t=(S.trash||[])[+v];if(!t)return;S.events.push(t.ev);S.trash.splice(+v,1);save();render()},
 chkver(){const el=document.getElementById('verres');el.textContent='Checking…';
  fetch(location.href.split('#')[0].split('?')[0]+'?nocache='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{const m=t.match(/APP_VERSION='([^']+)'/);if(!m){el.textContent='Could not read the version from the site.';return}
   el.innerHTML=m[1]===APP_VERSION?'<span style="color:var(--ok)">✓ This is the newest version on your site.</span>':'A different version is on your site: <b>'+E(m[1])+'</b>. Close this page completely and open the address again to load it.'}).catch(()=>{el.textContent='Could not check (open the app from your GitHub address, with internet).'})},
 sigdel(){if(!confirm('Remove your signature?'))return;delete S.settings.sig;save();render()},
 jtnew(){jtForm()},
 jtpreset(v){const f=document.getElementById('jtf');if(!f)return;const P={shiur:['Shiur / lecture','flat',0,'',0],online:['Online work','flat',0,'',1],event:['Speaking / event','flat',0,'',0],hourly:['Hourly work','hourly',0,'',0]}[v];
  f.name.value=P[0];f.mode.value=P[1];f.track.checked=!!P[4];f.name.focus()},jtedit(v){jtForm(v)},
 jtdel(v){if(S.events.some(e=>e.jt===v)||S.invoices.some(i=>i.jt===v))return alert('This job type has entries or invoices, so it cannot be deleted.');if(!confirm('Delete this job type?'))return;S.jobTypes=S.jobTypes.filter(j=>j.id!==v);save();closeModal();render()},
 clnew(){clForm()},cledit(v){clForm(v)},
 repn(v){const f=document.getElementById('evf');if(!f)return;if(f.rep.value==='none')f.rep.value='week';f.cnt.value=v;repPrev()},
 evpay(v){const e=S.events.find(x=>x.id===v);if(!e)return;if(!e.client){if(e.paid){if(!confirm('Undo the payment recorded for this one?'))return;e.paid=false;delete e.paidAmt;delete e.paidDate}else{const a=prompt('How much did you receive? (expected '+money(amountOf(e),S.settings.currency,'en')+')',String(amountOf(e)).replace('.',','));if(a===null)return;const n=parseFloat(String(a).replace(',','.'));if(!(n>0))return alert('Please type the amount.');e.paid=true;e.paidAmt=n;e.paidDate=today()}save();render();return}const c=clOf(e.client);c.payments=c.payments||[];const pm=payMap(c);
  if(pm.st[v]==='paid'){if(!confirm('Undo the payment recorded for this lesson?'))return;c.payments=c.payments.filter(p=>p.ev!==v)}
  else{const due=pm.due[v]>0?pm.due[v]:amountOf(e);if(!(amountOf(e)>0))return alert('This lesson has no price yet. Set the rate first.');
   const a=prompt('How much did they pay? (lesson price '+money(amountOf(e),S.settings.currency,'en')+(due!==amountOf(e)?', still owed '+money(due,S.settings.currency,'en'):'')+')',String(due).replace('.',','));if(a===null)return;
   const n=parseFloat(String(a).replace(',','.'));if(!(n>0))return alert('Please type the amount, for example 70.');c.payments.push({date:today(),amount:n,ev:v})}
  save();render();if(document.getElementById('modal').classList.contains('on')&&ui.unpaidFor===e.client)unpaidModal(e.client)},
 unpaid(v){unpaidModal(v)},
 paylist(v){payList(v)},
 stopcl(v){stopModal(v)},
 reactivate(v){const c=clOf(v);if(!confirm('Make '+c.name+' an active student again? Their old lessons stay as they were.'))return;c.status='active';delete c.endDate;delete c.endReason;delete c.endNote;save();render()},

 payedit(v){const [id,i]=v.split('|'),c=clOf(id),p=(c.payments||[])[+i];if(!p)return;const d=prompt('Date received (YYYY-MM-DD)',p.date);if(d===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return alert('Please use the format 2026-10-27.');const a=prompt('Amount received',String(p.amount).replace('.',','));if(a===null)return;const n=parseFloat(String(a).replace(',','.'));if(!(n>0))return alert('Please type the amount.');p.date=d;p.amount=n;save();render();payList(id)},

 bookahead(v){const c=clOf(v),ls=S.events.filter(e=>e.client===v&&jtOf(e.jt).mode==='session'&&e.start).sort((a,b)=>b.date.localeCompare(a.date));

 cldel(v){if(S.events.some(e=>e.client===v))return alert('This client has entries, so it cannot be deleted.');if(!confirm('Delete this client?'))return;S.clients=S.clients.filter(c=>c.id!==v);save();closeModal();render()},
 stmt(v){const ds=s=>s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(2,4),c=clOf(v),L=ledger(c),cur=S.settings.currency,M=n=>money(n,cur,'en');
  modal(`<div class="row noprint" style="margin-bottom:10px"><button class="b p" data-a="print">Print / save as PDF</button><span class="sp"></span><button class="b" data-a="close">Close</button></div>

  const o={name:d.name.trim(),kind:d.kind,email:d.email,phone:d.phone,address:d.address,notes:d.notes,rates,openBal:+d.openBal||0,avail:parseAvail(d),layout:d.layout,declTitle:d.declTitle,declNotes:d.declNotes};
  if(f.dataset.id)Object.assign(clOf(f.dataset.id),o);else S.clients.push({id:uid(),payments:[],...o});save();closeModal();render()}
 if(f.id==='cxf'){const e0=S.events.find(x=>x.id===f.dataset.id),lt=d.scope==='later'?laterOf(e0).filter(x=>x.status!=='cancelled'):[];applyCancel(f.dataset.id,d);lt.forEach(x=>applyCancel(x.id,{by:d.by,reason:d.reason,charge:!!d.charge,fee:d.fee,resched:''}));closeModal();render()}
 if(f.id==='clbf'){const n=bulkAdd(d.names,d.def);closeModal();ui.tab='cli';render();alert(n+' student'+(n===1?'':'s')+' added.')}
 if(f.id==='excf'){const date=f.dataset.date,to=d.to&&d.to>=date?d.to:date,t=d.type;
  if((t==='hours'||t==='block')&&!(d.start&&d.end&&d.end>d.start)){alert('Please give a start time and a later end time.');return}
  S.settings.exc=S.settings.exc||[];S.settings.exc.push({id:uid(),type:t,from:date,to,label:(d.label||'').trim(),start:d.start||'',end:d.end||'',key:d.key||''});save();closeModal();render()}
 if(f.id==='availf'){const hours={};for(let w=0;w<7;w++)hours[w]={on:!!d['on'+w],from:d['hf'+w]||'18:00',to:d['ht'+w]||'22:30',from2:d['mf'+w]||'',to2:d['mt'+w]||''};
  const blocks=[];for(let i=0;i<8;i++){const days=[];for(let w=0;w<7;w++)if(d['bk'+i+'d'+w])days.push(w);const mode=d['bk'+i+'m']==='sunset'?'sunset':'fixed';
   const okk=mode==='sunset'?(+d['bk'+i+'n']>0&&d['bk'+i+'o']!==undefined&&d['bk'+i+'o']!==''):!!(d['bk'+i+'f']&&d['bk'+i+'t']);
   if(okk&&days.length)blocks.push({label:(d['bk'+i+'l']||'').trim(),mode,from:d['bk'+i+'f']||'',to:d['bk'+i+'t']||'',off:+d['bk'+i+'o']||0,len:+d['bk'+i+'n']||0,gap:+d['bk'+i+'g']||0,days,start:d['bk'+i+'s']||'',end:d['bk'+i+'e']||''})}
  S.settings.hours=hours;S.settings.blocks=blocks;S.settings.candles=Math.max(0,+d.candles||0);S.settings.tzeit=Math.max(0,+d.tzeit||0);S.settings.buffer=Math.max(0,+d.buffer||0);S.settings.step=+d.step||30;save();alert('Saved.');const pl=problemsList().length;if(pl){ui.tab='cal';alert(pl+' upcoming lesson'+(pl===1?'':'s')+' no longer fit. They are listed at the top of the Calendar.')}render()}
 if(f.id==='setf'){Object.assign(S.settings,{fullName:d.fullName,city:d.city,iban:d.iban,name:d.name,address:d.address,email:d.email,phone:d.phone,payment:d.payment,currency:d.currency,lang:d.lang,prefix:d.prefix,next:+d.next||1,vat:+d.vat||0});save();alert('Saved.');render()}
});
